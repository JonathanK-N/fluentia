name: Quality checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit des dépendances
        run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: apps/web/package-lock.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser
          path: apps/web/test-results
          retention-days: 7
  api:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker version
      - name: Construire le frontend
        run: docker build --tag fluentia-web:validation apps/web
      - name: Démarrer et contrôler le conteneur
        shell: bash
        run: |
          docker run --detach --name fluentia-web-validation -p 127.0.0.1:3200:3000 fluentia-web:validation
          trap 'docker logs fluentia-web-validation; docker rm -f fluentia-web-validation' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3200/ > /tmp/fluentia-home.html; then break; fi
            sleep 1
          done
          grep -q 'Fluentia' /tmp/fluentia-home.html
          curl --fail --silent http://127.0.0.1:3200/design-system > /tmp/fluentia-catalogue.html
          grep -q 'Couleurs' /tmp/fluentia-catalogue.html
          curl --fail --silent http://127.0.0.1:3200/apercu/etudiant > /tmp/fluentia-etudiant.html
          grep -q 'Bienvenue sur Fluentia' /tmp/fluentia-etudiant.html
          curl --fail --silent http://127.0.0.1:3200/manifest.webmanifest
          curl --fail --silent http://127.0.0.1:3200/branding/02_Icons_PWA/icon-192x192.png > /tmp/fluentia-icon.png
