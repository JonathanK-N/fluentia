components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - display_name
      - email
      - email_verified
      - id
    ActionEnum:
      enum:
      - request_review
      - approve
      - reject
      type: string
      description: |-
        * `request_review` - request_review
        * `approve` - approve
        * `reject` - reject
    Attempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        skill:
          type: string
          readOnly: true
        mode:
          type: string
          readOnly: true
        exam_title:
          type: string
          readOnly: true
      required:
      - exam_id
      - exam_title
      - expires_at
      - id
      - mode
      - skill
      - started_at
      - status
      - submitted_at
    AttemptRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        skill:
          type: string
          readOnly: true
        mode:
          type: string
          readOnly: true
        exam_title:
          type: string
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionPublic'
          readOnly: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/SavedAnswer'
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - answers
      - exam_id
      - exam_title
      - expires_at
      - id
      - mode
      - questions
      - server_now
      - skill
      - started_at
      - status
      - submitted_at
    Bank:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        family:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
          default: 1
        revision:
          type: integer
          readOnly: true
        skill:
          allOf:
          - $ref: '#/components/schemas/SkillEnum'
          readOnly: true
        difficulty:
          allOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          readOnly: true
        statement:
          type: string
          readOnly: true
        passage:
          type: string
          readOnly: true
        media:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        choices:
          readOnly: true
        correct_index:
          type: integer
          readOnly: true
        explanation:
          type: string
          readOnly: true
        origin:
          allOf:
          - $ref: '#/components/schemas/OriginEnum'
          readOnly: true
        provenance:
          type: string
          readOnly: true
        credit:
          type: string
          readOnly: true
          description: Attribution réelle ; conserver les sources et contributions.
        editor:
          type: integer
          readOnly: true
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        reviewer:
          type: integer
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        review_note:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - choices
      - correct_index
      - credit
      - difficulty
      - editor
      - explanation
      - family
      - id
      - media
      - origin
