              schema:
                $ref: '#/components/schemas/AttemptRead'
          description: ''
  /api/v1/attempts/{attempt_id}/answers/:
    put:
      operationId: api_v1_attempts_answers_update
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaveAnswer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveAnswer'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveAnswerResponse'
          description: ''
  /api/v1/attempts/{attempt_id}/questions/{question_id}/audio/:
    post:
      operationId: api_v1_attempts_questions_audio_create
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
