  /api/v1/bank/:
    get:
      operationId: api_v1_bank_list
      parameters:
      - in: query
        name: difficulty
        schema:
          type: string
        description: 'Difficulté proposée : non_calibree, A1 à C2'
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: skill
        schema:
          type: string
        description: reading ou listening
      - in: query
        name: state
        schema:
          type: string
        description: draft, review, approved ou published
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankList'
          description: ''
    post:
      operationId: api_v1_bank_create
      parameters:
      - in: query
        name: difficulty
        schema:
          type: string
        description: 'Difficulté proposée : non_calibree, A1 à C2'
      - in: query
        name: skill
        schema:
          type: string
        description: reading ou listening
      - in: query
