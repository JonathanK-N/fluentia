<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Fluentia — Maîtrisez le français, allez plus loin.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061b3d"/>
      <stop offset="0.55" stop-color="#081b35"/>
      <stop offset="1" stop-color="#0f1530"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#7fe9ff"/>
      <stop offset="0.45" stop-color="#21d4f4"/>
      <stop offset="1" stop-color="#1769e0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#21d4f4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#21d4f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#21d4f4"/>
    </linearGradient>
    <style>
      .t { font-family: Poppins, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.4s ease-in-out infinite; }
      .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
      .b5 { animation-delay: .6s } .b6 { animation-delay: .75s } .b7 { animation-delay: .9s }
      @keyframes wave { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(.92); opacity: .55 } 50% { transform: scale(1.08); opacity: 1 } }
      .ring { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
      .ring2 { animation-duration: 26s; animation-direction: reverse; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .rise { opacity: 0; animation: rise .9s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .45s } .d3 { animation-delay: .8s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .dot { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <!-- grille discrète -->
  <g stroke="#21d4f4" stroke-opacity=".06">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>
  <g fill="#21d4f4">
    <circle class="dot" cx="120" cy="52" r="2"/>
    <circle class="dot" cx="690" cy="276" r="2" style="animation-delay:.8s"/>
    <circle class="dot" cx="1130" cy="60" r="2" style="animation-delay:1.6s"/>
    <circle class="dot" cx="560" cy="40" r="1.6" style="animation-delay:1.1s"/>
  </g>

  <!-- texte -->
  <g class="t">
    <text class="rise d1" x="72" y="118" font-size="15" letter-spacing="3" fill="#21d4f4" font-weight="600">PRÉPARATION AU TCF CANADA · PROPULSÉE PAR L’IA</text>
    <text class="rise d2" x="70" y="196" font-size="78" font-weight="700" fill="url(#title)">Fluentia</text>
    <text class="rise d3" x="72" y="244" font-size="24" fill="#c9d6ea">Maîtrisez le français, allez plus loin.</text>
  </g>

  <!-- orbe vocal -->
  <g transform="translate(930 160)">
    <circle class="pulse" r="128" fill="url(#glow)"/>
    <g class="ring"><ellipse rx="104" ry="38" fill="none" stroke="#21d4f4" stroke-opacity=".45" stroke-width="1.5"/></g>
    <g class="ring ring2"><ellipse rx="38" ry="104" fill="none" stroke="#1769e0" stroke-opacity=".6" stroke-width="1.5"/></g>
    <circle r="70" fill="url(#orb)"/>
    <ellipse cx="-22" cy="-26" rx="26" ry="14" fill="#ffffff" fill-opacity=".28" transform="rotate(-30 -22 -26)"/>
    <!-- ondes sonores -->
    <g fill="#f7faff" transform="translate(-42 -22)">
      <rect class="bar"    x="0"  y="0" width="7" height="44" rx="3.5"/>
      <rect class="bar b2" x="13" y="0" width="7" height="44" rx="3.5"/>
      <rect class="bar b3" x="26" y="0" width="7" height="44" rx="3.5"/>
      <rect class="bar b4" x="39" y="0" width="7" height="44" rx="3.5"/>
      <rect class="bar b5" x="52" y="0" width="7" height="44" rx="3.5"/>
      <rect class="bar b6" x="65" y="0" width="7" height="44" rx="3.5"/>
      <rect class="bar b7" x="78" y="0" width="7" height="44" rx="3.5"/>
    </g>
  </g>
</svg>
