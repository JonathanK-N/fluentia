services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluentia}
      POSTGRES_USER: ${POSTGRES_USER:-fluentia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluentia}"]
      interval: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./apps/web
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
