services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluentia}
      POSTGRES_USER: ${POSTGRES_USER:-fluentia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluentia}"]
      interval: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      PRIVATE_MEDIA_ROOT: /var/lib/fluentia/private-media
    volumes: [private_media:/var/lib/fluentia/private-media]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      args:
        API_ORIGIN: ${API_ORIGIN:-http://api:8000}
    environment:
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  private_media:
